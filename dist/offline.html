<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#047857" />
    <title>Verifix | Offline</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      body {
        background-color: #f8fafc;
        color: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: #ffffff;
        border-radius: 24px;
        padding: 36px 24px;
        max-width: 420px;
        width: 100%;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        border: 1px solid #e2e8f0;
      }
      .icon-box {
        width: 64px;
        height: 64px;
        background: linear-gradient(135deg, #047857, #10b981);
        border-radius: 20px;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        box-shadow: 0 8px 20px rgba(4, 120, 87, 0.3);
      }
      h1 { font-size: 20px; font-weight: 800; color: #0f172a; margin-bottom: 8px; }
      p { font-size: 13px; color: #64748b; line-height: 1.5; margin-bottom: 24px; }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 52px;
        background: #047857;
        color: white;
        border: none;
        border-radius: 16px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, background 0.15s ease;
      }
      .btn:active { transform: scale(0.98); }
      .btn:hover { background: #065f46; }
      .badge {
        display: inline-block;
        padding: 4px 12px;
        background: #ecfdf5;
        color: #047857;
        border-radius: 9999px;
        font-size: 11px;
        font-weight: 700;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon-box">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
      <div class="badge">No Internet Connection</div>
      <h1>You're currently offline</h1>
      <p>Verifix requires an internet connection to match verified local service providers and sync live OTP updates. Please check your data or Wi-Fi.</p>
      <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    </div>
  </body>
</html>
